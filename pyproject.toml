[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "asl_rl"
version = "0.0.1"
description = "A minimal, performant implementation of PPO in JAX"
authors = [{ name = "Daniel Morton", email = "danielpmorton@gmail.com" }]
readme = "README.md"
keywords = ["rl", "ppo", "robot", "control"]
dependencies = ["distrax", "flax", "jax", "numpy", "optax"]

[project.optional-dependencies]
cuda13 = ["jax[cuda13]"]
wandb = ["wandb"]
onnx = ["onnx"]
examples = ["frax", "matplotlib", "mujoco", "mujoco-mjx[warp]>=3.11"]
dev = ["ruff"]
all = ["asl_rl[examples,dev,cuda13,wandb,onnx]"]

[project.urls]
Repository = "https://github.com/StanfordASL/asl_rl/"

[tool.setuptools.packages.find]
include = ["asl_rl*"]
